{% extends "base.html" %}
{% block body %}
<div class="task-page">
    <div class="task-header">
        <h1>{{ task.title }}</h1>
        <a href="/tasks" class="btn btn-secondary">← Back</a>
    </div>
    <form method="POST" action="/tasks/{{ task.id }}/update" id="task-form">
        <div class="task-meta">
            <div class="form-row">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" name="title" value="{{ task.title }}" required>
                </div>
                <div class="form-group">
                    <label>Project</label>
                    <input type="text" name="project" value="{{ task.project or '' }}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Status</label>
                    <select name="status">
                        <option value="pending" {{ 'selected' if task.status == 'pending' }}>Pending</option>
                        <option value="in_progress" {{ 'selected' if task.status == 'in_progress' }}>In Progress</option>
                        <option value="complete" {{ 'selected' if task.status == 'complete' }}>Complete</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <input type="text" value="{{ task.task_type }}" disabled>
                </div>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea name="notes" rows="3">{{ task.notes or '' }}</textarea>
            </div>
        </div>
        <div class="task-items" id="items-container"></div>
        <input type="hidden" name="items_json" id="items-json" value="{{ task.items_json | e }}">
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/tasks" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
<script>
let items = JSON.parse(document.getElementById('items-json').value);
const container = document.getElementById('items-container');

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

function renderItems() {
    let html = '';
    items.forEach((item, i) => {
        if (item.type === 'section') {
            html += '<div class="item-section">' + escapeHtml(item.text) + '</div>';
        } else if (item.type === 'check') {
            const checked = item.checked ? 'checked' : '';
            html += '<label class="item-check"><input type="checkbox" ' + checked +
                    ' data-index="' + i + '">' + escapeHtml(item.text) + '</label>';
        } else if (item.type === 'field') {
            const unit = item.unit ? ' (' + escapeHtml(item.unit) + ')' : '';
            html += '<div class="item-field"><label>' + escapeHtml(item.label) + unit +
                    '</label><input type="text" value="' + escapeHtml(item.value) +
                    '" data-index="' + i + '"></div>';
        }
    });
    container.innerHTML = html;
}

function syncJson() {
    document.getElementById('items-json').value = JSON.stringify(items);
}

container.addEventListener('change', function(e) {
    const i = parseInt(e.target.dataset.index);
    if (e.target.type === 'checkbox') {
        items[i].checked = e.target.checked;
    } else {
        items[i].value = e.target.value;
    }
    syncJson();
});

renderItems();
</script>
{% endblock %}
