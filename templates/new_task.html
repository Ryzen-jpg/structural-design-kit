{% extends "base.html" %}
{% block body %}
<div class="task-page">
    <div class="task-header">
        <h1>New Task</h1>
        <a href="/tasks" class="btn btn-secondary">← Back</a>
    </div>
    <form method="POST" action="/tasks/create" class="task-form">
        <div class="form-group">
            <label>Template</label>
            <select name="template_id" id="template-select" onchange="updatePreview()">
                {% for t in templates %}
                <option value="{{ t.id }}">{{ t.name }} ({{ t.type }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Task Title</label>
            <input type="text" name="title" required placeholder="e.g. Beam B-12 design check">
        </div>
        <div class="form-group">
            <label>Project</label>
            <input type="text" name="project" placeholder="e.g. Kathmandu Office Building">
        </div>
        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="3" placeholder="Additional context..."></textarea>
        </div>
        <div id="template-preview" class="template-preview"></div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Task</button>
            <a href="/tasks" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
<script>
const templates = {{ templates_json | safe }};
function updatePreview() {
    const sel = document.getElementById('template-select');
    const t = templates.find(t => t.id === sel.value);
    const el = document.getElementById('template-preview');
    if (!t) { el.innerHTML = ''; return; }
    let html = '<div class="preview-title">' + t.name + '</div>';
    html += '<div class="preview-desc">' + t.description + '</div>';
    t.items.forEach(item => {
        if (item.type === 'section') {
            html += '<div class="preview-section">' + item.text + '</div>';
        } else if (item.type === 'check') {
            html += '<div class="preview-item">☐ ' + item.text + '</div>';
        } else if (item.type === 'field') {
            html += '<div class="preview-item">' + item.label + (item.unit ? ' (' + item.unit + ')' : '') + '</div>';
        }
    });
    el.innerHTML = html;
}
updatePreview();
</script>
{% endblock %}
